<header class="portal-header">
    <div class="portal-header-left">
        <div class="portal-logo">E</div>
        <div class="portal-brand-text">
            <h2>EXAM PROCTOR FACULTY PORTAL</h2>
            <div class="portal-subtitle">
                <span class="role-badge">FACULTY</span>
                {{ portal_breadcrumb|default:"DASHBOARD" }}
            </div>
        </div>
    </div>
    <div class="portal-header-right">
        <div>
            <div class="portal-user-name">{{ user.get_full_name|default:user.username }}</div>
            <div class="portal-user-id">Faculty Member</div>
        </div>
        <div class="portal-avatar-placeholder">{{ user.username|slice:":1"|upper }}</div>
        {% include "includes/portal_logout_button.html" %}
    </div>
</header>
